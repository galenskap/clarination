# Vhost Nginx pour Clarination (PWA Vue, history mode).
# Le workflow GitHub Actions rsync le contenu de dist/ vers VPS_PATH.
#
# Installation (avant Certbot) :
#   sudo mkdir -p /var/www/clarination
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/clarination
#   sudo ln -sf /etc/nginx/sites-available/clarination /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d clarination.lude-web.studio
#
# Remplacer server_name et root par le domaine et VPS_PATH réels.
# HTTPS est obligatoire pour l’accès micro (getUserMedia).

server {
    listen 80;
    listen [::]:80;
    server_name clarination.lude-web.studio;

    root /var/www/clarination;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Le service worker et l’index ne doivent pas rester en cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets hashés par Vite : cache longue durée.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
